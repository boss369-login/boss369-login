<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOSS369 - เข้าสู่ระบบ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0f0f0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: linear-gradient(145deg, #1a1a1a, #111111);
            border: 1px solid #d4af37;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
            text-align: center;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #d4af37;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            color: #cccccc;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #333333;
            background: #222222;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #d4af37, #f3e5ab);
            color: #000000;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">BOSS369</div>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="username">ชื่อผู้ใช้ / เบอร์โทรศัพท์</label>
                <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้" required>
            </div>
            
            <div class="input-group">
                <label for="password">รหัสผ่าน</label>
                <input type="password" id="password" placeholder="กรอกรหัสผ่าน" required>
            </div>
            
            <button type="submit" class="btn-submit">เข้าสู่ระบบ</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // ป้องกันหน้าเว็บรีเฟรช
            
            // ส่งผู้ใช้งานไปยังหน้าเว็บจริงทันที
            window.location.href = "https://www.ufgrowfun.com/HomeSmart.aspx?lang=EN-GB";
        });
    </script>

</body>
</html>
